name: App templates
# Proves every templates/apps/<id> scaffolds and passes its own verify commands on a clean runner.
# No Claude involved — only toolchains — so no token or API key is needed.
on:
  pull_request:
    paths: ['templates/apps/**', 'scripts/scaffold-app.mjs', 'scripts/sdlc.mjs', 'scripts/lib.mjs', '.github/workflows/templates.yml']
  push:
    branches: [main]
    paths: ['templates/apps/**', 'scripts/scaffold-app.mjs']
  schedule:
    - cron: '0 3 * * 1'   # weekly: catch toolchain / registry drift
  workflow_dispatch:
permissions:
  contents: read
jobs:
  template:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: edge-web-nuxt, component: edge-web, ui: vue, dir: . }
          - { id: edge-web-next, component: edge-web, ui: react, dir: . }
          - { id: bff-web-nuxt, component: bff-web, ui: vue, dir: web }
          - { id: bff-web-next, component: bff-web, ui: react, dir: web }
          - { id: go-api, component: go-api, ui: vue, dir: api }
          - { id: tauri-vue, component: tauri, ui: vue, dir: . }
          - { id: tauri-react, component: tauri, ui: react, dir: . }
          - { id: flutter, component: flutter, ui: vue, dir: mobile }
          - { id: edge-web-hono-react, component: edge-web, ui: react-hono, dir: . }
          - { id: spa-web-nuxt, component: spa-web, ui: vue, dir: web }
          - { id: spa-web-react, component: spa-web, ui: react, dir: web }
          - { id: expo, component: expo, ui: vue, dir: mobile }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - if: matrix.id == 'go-api'
        uses: actions/setup-go@v5
        with: { go-version: stable }
      - if: startsWith(matrix.id, 'tauri')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - if: startsWith(matrix.id, 'tauri')
        uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - if: matrix.id == 'flutter'
        uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Scaffold and verify
        env:
          DATABASE_URL: ${{ matrix.id == 'go-api' && 'postgres://app:app@localhost:5432/app?sslmode=disable' || '' }}
        run: |
          T="$RUNNER_TEMP/app"
          mkdir -p "$T" && cd "$T" && git init -q
          export CLAUDE_PROJECT_DIR="$T"
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" init
          dirflag=""; [ "${{ matrix.dir }}" != "." ] && dirflag="--dir ${{ matrix.dir }}"
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" scaffold-app ${{ matrix.component }} --ui ${{ matrix.ui }} --name ci-app $dirflag

  # Combinations: templates scaffolded together must still be green (shared Nuxt layer, contract, compose).
  combo:
    name: combo ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: nuxt-web+desktop (shared layer), surfaces: 'web,desktop', backend: fullstack, choice: default }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - name: Scaffold together and verify
        run: |
          T="$RUNNER_TEMP/app"
          mkdir -p "$T" && cd "$T" && git init -q
          export CLAUDE_PROJECT_DIR="$T"
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" init
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" stack --choice ${{ matrix.choice }} --surfaces ${{ matrix.surfaces }} --backend ${{ matrix.backend }}
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" scaffold-app --name ci-app
          test -d packages/ui-layer
