name: App templates
# Proves every templates/apps/<id> scaffolds and passes its own verify commands on a clean runner.
# No Claude involved — only toolchains — so no token or API key is needed.
# PRs and pushes run only the templates that changed; the weekly run and manual runs cover all of them.
on:
  pull_request:
    paths: ['templates/apps/**', 'scripts/scaffold-app.mjs', 'scripts/sdlc.mjs', 'scripts/lib.mjs', '.github/workflows/templates.yml', '.github/scripts/pick-templates.mjs']
  push:
    branches: [main]
    paths: ['templates/apps/**', 'scripts/scaffold-app.mjs', 'scripts/sdlc.mjs', 'scripts/lib.mjs', '.github/workflows/templates.yml', '.github/scripts/pick-templates.mjs']
  schedule:
    - cron: '0 3 * * 1'   # weekly: catch toolchain / registry drift
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      combo: ${{ steps.pick.outputs.combo }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node .github/scripts/pick-templates.mjs >> "$GITHUB_OUTPUT"

  template:
    name: ${{ matrix.id }}
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - id: pnpm
        if: hashFiles(format('templates/apps/{0}/app/pnpm-lock.yaml', matrix.id)) != ''
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: steps.pnpm.outputs.store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ matrix.id }}-${{ hashFiles(format('templates/apps/{0}/app/pnpm-lock.yaml', matrix.id)) }}
          restore-keys: pnpm-${{ matrix.id }}-
      - if: matrix.id == 'go-api'
        uses: actions/setup-go@v5
        with: { go-version: stable, cache-dependency-path: templates/apps/go-api/app/go.sum }
      - if: startsWith(matrix.id, 'tauri')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - if: startsWith(matrix.id, 'tauri')
        uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - if: matrix.id == 'flutter'
        uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Scaffold and verify
        env:
          DATABASE_URL: ${{ matrix.id == 'go-api' && 'postgres://app:app@localhost:5432/app?sslmode=disable' || '' }}
        run: |
          T="$RUNNER_TEMP/app"
          mkdir -p "$T" && cd "$T" && git init -q
          export CLAUDE_PROJECT_DIR="$T"
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" init
          dirflag=""; [ "${{ matrix.dir }}" != "." ] && dirflag="--dir ${{ matrix.dir }}"
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" scaffold-app ${{ matrix.component }} --ui ${{ matrix.ui }} --name ci-app $dirflag

  # Combinations: templates scaffolded together must still be green (shared Nuxt layer, contract, compose).
  combo:
    name: combo ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.combo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: nuxt-web+desktop (shared layer), surfaces: 'web,desktop', backend: fullstack, choice: templates, expect: 'packages/ui-layer' }
          - { name: web+marketing site (separate Nuxt projects), surfaces: 'web,site', site: marketing, backend: fullstack, choice: templates, expect: 'web site' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - if: contains(matrix.surfaces, 'desktop')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - if: contains(matrix.surfaces, 'desktop')
        uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - name: Scaffold together and verify
        run: |
          T="$RUNNER_TEMP/app"
          mkdir -p "$T" && cd "$T" && git init -q
          export CLAUDE_PROJECT_DIR="$T"
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" init
          sitef=""; [ -n "${{ matrix.site }}" ] && sitef="--site ${{ matrix.site }}"
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" stack --choice ${{ matrix.choice }} --surfaces ${{ matrix.surfaces }} --backend ${{ matrix.backend }} $sitef
          node "$GITHUB_WORKSPACE/scripts/sdlc.mjs" scaffold-app --name ci-app
          for d in ${{ matrix.expect }}; do test -d "$d" || { echo "missing $d"; exit 1; }; done
          # a site is its own Nuxt project: it never joins the shared layer
          if [ -n "$sitef" ]; then test ! -d packages/ui-layer || { echo "site must not create packages/ui-layer"; exit 1; }; fi
