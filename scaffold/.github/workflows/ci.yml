# Quality checks: typecheck, the risk-tier suite, and every agreed example as a browser
# check. Screenshots are uploaded so reviewers can see what was checked.
# Deploys are NOT done here. Cloudflare Workers Builds deploys from git (docs/SETUP.md),
# so no Cloudflare credentials ever live in GitHub.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:risk
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:examples
      # Third-party action referenced by major tag — pin it to a commit SHA after install.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 14
