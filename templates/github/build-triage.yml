name: Build triage
# Read-only judgment step (playbook Stage 5, CI/CD play step 1): when CI fails on a PR, Claude reads
# the failed logs and posts a three-line triage — flaky or real, most likely cause, next action.
on:
  workflow_run:
    workflows: ['CI']   # name of your main CI workflow
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Collect failed logs
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh run view ${{ github.event.workflow_run.id }} --log-failed > build.log || true
      - name: Triage
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }
        run: >
          claude -p "Read build.log. Identify the most likely cause, say whether the failure looks flaky or real,
          and write a three-line summary for the PR thread. No preamble." --allowedTools "Read,Grep" > triage.md
      - name: Comment
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          pr=$(gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls --jq '.[0].number')
          [ -n "$pr" ] && gh pr comment "$pr" --body-file triage.md || true
