name: Claude review
# Layered review: every PR gets the same ranked passes from REVIEW.md; `@claude` in a comment
# asks Claude to address it and push a fix. Findings never approve or block — branch protection
# still requires a code owner (separation of duties).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # from `claude setup-token` (subscription)
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}           # or: API key instead
          prompt: |
            Review PR #${{ github.event.pull_request.number }} following REVIEW.md exactly.
            Read the change's docs/sdlc/<id>/spec.md and plan.md (find the id from the PR body or the changed
            docs/sdlc paths) and check compliance against them. Post ONE summary comment with findings ranked
            Important first, each tagged [bugs|security|compliance] with file:line and a failure scenario,
            plus inline comments for Important findings. Do not approve or request changes.
          claude_args: --allowedTools "Read,Grep,Glob,Bash(git diff *),Bash(git log *),Bash(gh pr *),mcp__github_inline_comment__create_inline_comment"
  respond:
    if: (github.event_name != 'pull_request') && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
