# Local stack: Postgres + the Go API. `docker compose up -d postgres` is enough for `go test ./...` and `go run ./cmd/server`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: __APP_SNAKE__
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d __APP_SNAKE__"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/__APP_SNAKE__?sslmode=disable
      PORT: "8080"
      RUN_MIGRATIONS: "true"
      # Local development over http. Production: APP_ENV=production, https URLs, COOKIE_SECURE=true (default).
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: "false"
      AUTH_REGISTRATION: open
      MAGIC_LINK: log                      # sign-in links are printed in `docker compose logs api`
      NATIVE_REDIRECT_URIS: com.example.__APP_NAME__:/oauth
      # TRUSTED_PROXIES: 172.16.0.0/12     # when a reverse proxy in this network sets X-Forwarded-For
      # OIDC_PROVIDERS: google             # + OIDC_GOOGLE_ISSUER / _CLIENT_ID / _CLIENT_SECRET (see api/.env.example)
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
