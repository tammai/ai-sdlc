version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unused
  exclusions:
    generated: lax
    paths:
      - internal/api/gen
      - internal/db/sqlc
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - internal/api/gen
      - internal/db/sqlc
